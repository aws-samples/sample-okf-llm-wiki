[project]
name = "okf-canvas"
version = "0.1.0"
description = "Canvas CI runtime: the dashboard-authoring agent (lint/save/render/submit) on AgentCore"
requires-python = ">=3.11"
dependencies = [
    # Sibling libs (okf-core, okf-aws, okf-consumption-mcp) are deliberately NOT
    # declared: they are not published to PyPI (and "okf-core" there is an
    # unrelated third-party project), so a bare name would resolve from the public
    # index. Install them from local source first — see the Dockerfile.
    "deepagents>=0.7",
    "langchain-aws>=0.2",
    "langgraph-checkpoint-aws>=0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
# The visual-inspection renderer; the runtime image installs chromium via
# `playwright install --with-deps chromium`. Absent (unit venv), the render
# tool degrades to unavailable — nothing else needs a browser.
render = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
