[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-harvest"
version = "0.1.0"
description = "OKF harvest agent: LangChain deepagents deep agent on Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    # Sibling libs (okf-core, okf-aws) are deliberately NOT declared: they are
    # not published to PyPI (and "okf-core" there is an unrelated third-party
    # project), so a bare name would resolve from the public index. Install them
    # from local source first — see the Dockerfile and README. okf-aws carries
    # the shared LLM client factory (okf_aws.model_factory) agent.py delegates to.
    # Deterministic policy-rules evaluator (okf_core.policy_rules): parse +
    # qualify agent SQL against the dataset schema. Optional in okf-core;
    # a REAL dependency here — this runtime evaluates (or self-tests) rules.
    "sqlglot>=30.0",
    "deepagents>=0.7.0,<0.8",
    "langchain>=1.3",
    # ChatBedrockConverse lives in the standalone langchain-aws partner package,
    # which we import directly (agent.py) — depend on it explicitly rather than
    # relying on the langchain[aws] extra to pull a compatible version.
    "langchain-aws>=1.6.4",
    # GPT on Bedrock Runtime: ChatOpenAI (agent.py) drives the Bedrock Runtime OpenAI-
    # compatible endpoint, and aws-bedrock-token-generator mints the SigV4-derived
    # bearer key it authenticates with. Both are imported lazily inside
    # _build_bedrock_openai, so the module still imports for tests without them.
    "langchain-openai>=1.3",
    "aws-bedrock-token-generator>=1.0",
    "langchain-quickjs>=0.3",
    "bedrock-agentcore>=1.16",
    "boto3>=1.43",
    # Observability: ADOT SDK. LangChain/LangGraph spans are emitted via the
    # langsmith SDK's native OTEL bridge (a transitive dep of langchain), gated by
    # LANGSMITH_TRACING + LANGSMITH_OTEL_ONLY env on the runtime — no separate
    # framework instrumentor. Mirror of requirements.txt.
    "aws-opentelemetry-distro>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
